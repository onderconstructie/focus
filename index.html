<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <title>Focus – Onder Constructie</title>
    <meta name="description" content="Werk in blokken, neem pauzes. Een strakke timer om geconcentreerd te werken.">
    <meta name="oc:groep" content="zakmes">
    <meta name="oc:labels" content="concentratie">
    <meta name="oc:kort" content="Geconcentreerd werken in blokken, met pauzes">
    <meta name="oc:volgorde" content="120">
    <meta name="oc:opslag" content="focusSettings, focusRun">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;18&quot; fill=&quot;%23f8fafc&quot; stroke=&quot;%23e2e8f0&quot; stroke-width=&quot;1.5&quot;/%3E%3Crect x=&quot;17.5&quot; y=&quot;7&quot; width=&quot;5&quot; height=&quot;3&quot; rx=&quot;1.2&quot; fill=&quot;%2394a3b8&quot;/%3E%3Cline x1=&quot;20&quot; y1=&quot;10&quot; x2=&quot;20&quot; y2=&quot;12&quot; stroke=&quot;%2394a3b8&quot; stroke-width=&quot;2&quot;/%3E%3Ccircle cx=&quot;20&quot; cy=&quot;22&quot; r=&quot;9.5&quot; stroke=&quot;%23cbd5e1&quot; stroke-width=&quot;3&quot;/%3E%3Cpath d=&quot;M20 12.5 A9.5 9.5 0 0 1 29.03 25&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot;/%3E%3Cpath d=&quot;M20 22 L20 12.5 A9.5 9.5 0 0 1 29.03 25 Z&quot; fill=&quot;%2310b981&quot; opacity=&quot;.18&quot;/%3E%3Ccircle cx=&quot;20&quot; cy=&quot;22&quot; r=&quot;1.8&quot; fill=&quot;%23047857&quot;/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --wit: #ffffff;
            --accent: #10b981;
            --accent-dark: #047857;
            --accent-darker: #065f46;
            --accent-light: #d1fae5;
            --accent-ring: rgba(16, 185, 129, 0.15);
            --break: #10b981;
            --break-light: #d1fae5;
            --break-ring: rgba(16, 185, 129, 0.15);
            --long-break: #047857;
            --long-break-light: #d1fae5;
            --long-break-ring: rgba(4, 120, 87, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --ink: #047857;
            --ink-2: #065f46;
            --ring: #047857;
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--slate-50);
            color: var(--slate-700);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            background: var(--wit);
            border-bottom: 1px solid var(--slate-200);
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 44px;
            font-size: 0.875rem;
            color: var(--slate-500);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--ink);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        .settings-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 44px;
            height: 44px;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-sm);
            background: var(--wit);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--slate-500);
            transition: var(--transition);
        }

        .settings-btn:hover {
            border-color: var(--accent);
            color: var(--ink);
        }

        .settings-btn svg {
            width: 20px;
            height: 20px;
        }

        .logo {
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .logo svg {
            width: 56px;
            height: 56px;
        }

        .site-title {
            font-size: 1.625rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .site-subtitle {
            font-size: 0.9375rem;
            color: var(--slate-500);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            gap: 2rem;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--wit);
            border: 1px solid var(--slate-200);
            border-radius: 100px;
        }

        .mode-tab {
            min-height: 44px;
            padding: 0.625rem 1.125rem;
            border: none;
            background: transparent;
            border-radius: 100px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--slate-500);
            cursor: pointer;
            transition: var(--transition);
        }

        .mode-tab:hover {
            color: var(--slate-700);
        }

        .mode-tab.active {
            background: var(--slate-800);
            color: var(--wit);
        }

        /* Timer Card */
        .timer-card {
            background: var(--wit);
            border: 1.5px solid var(--slate-200);
            border-radius: 24px;
            padding: 3rem 4rem;
            text-align: center;
            transition: var(--transition);
            max-width: 100%;
            min-width: 0;
        }

        .timer-card[data-mode="focus"] {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-ring);
        }

        .timer-card[data-mode="break"] {
            border-color: var(--break);
            box-shadow: 0 0 0 4px var(--break-ring);
        }

        .timer-card[data-mode="long-break"] {
            border-color: var(--long-break);
            box-shadow: 0 0 0 4px var(--long-break-ring);
        }

        .timer-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .timer-card[data-mode="focus"] .timer-label { color: var(--ink); }
        .timer-card[data-mode="break"] .timer-label { color: var(--ink); }
        .timer-card[data-mode="long-break"] .timer-label { color: var(--ink-2); }

        .timer-display {
            font-family: 'DM Sans', system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 6rem;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
            color: var(--slate-800);
        }

        @media (max-width: 480px) {
            .main {
                padding: 2rem 1rem;
            }
            .timer-display {
                font-size: clamp(3.25rem, 17vw, 4rem);
            }
            .timer-card {
                width: 100%;
                padding: 2rem 1rem;
            }
            .mode-tab {
                padding: 0.625rem 0.875rem;
            }
            .mode-tabs {
                border-radius: 24px;
            }
        }

        .timer-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 44px;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 100px;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-primary {
            background: var(--accent-dark);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-darker);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: var(--slate-100);
            color: var(--slate-600);
            border: 1px solid var(--slate-200);
        }

        .btn-secondary:hover {
            border-color: var(--slate-300);
            color: var(--slate-700);
        }

        /* Progress */
        .progress-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .progress-dots {
            display: flex;
            gap: 0.5rem;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--slate-200);
            transition: var(--transition);
        }

        .progress-dot.completed {
            background: var(--accent);
        }

        .progress-dot.current {
            background: var(--wit);
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }

        .progress-label {
            font-size: 0.8125rem;
            color: var(--slate-500);
        }

        .progress-count {
            font-weight: 600;
            color: var(--slate-600);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--slate-200);
            background: var(--wit);
        }

        .quote {
            font-size: 0.8125rem;
            color: var(--ink);
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--wit);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.12);
            transform: translateY(20px) scale(0.95);
            transition: var(--transition);
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 1.5rem 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--slate-800);
        }

        .modal-close {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--slate-100);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--slate-500);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--slate-200);
            color: var(--slate-700);
        }

        .modal-close svg {
            width: 16px;
            height: 16px;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .setting-group {
            margin-bottom: 1.25rem;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--slate-600);
            margin-bottom: 0.5rem;
        }

        .setting-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .setting-label .dot.focus { background: var(--accent); }
        .setting-label .dot.break { background: var(--break); }
        .setting-label .dot.long-break { background: var(--long-break); }

        .setting-input-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .setting-input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-variant-numeric: tabular-nums;
            font-size: 1rem;
            min-height: 44px;
            color: var(--slate-800);
            background: var(--slate-50);
            transition: var(--transition);
            min-width: 0;
        }

        .setting-input:focus {
            border-color: var(--accent);
        }

        .setting-unit {
            font-size: 0.8125rem;
            color: var(--slate-500);
            min-width: 50px;
        }

        .setting-divider {
            height: 1px;
            background: var(--slate-200);
            margin: 1.25rem 0;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-row-label {
            font-size: 0.875rem;
            color: var(--slate-700);
        }

        .setting-row-desc {
            font-size: 0.75rem;
            color: var(--slate-500);
            margin-top: 0.125rem;
        }

        /* Toggle Switch */
        .toggle {
            position: relative;
            display: block;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            cursor: pointer;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            left: 0;
            right: 0;
            top: 10px;
            height: 24px;
            background: var(--slate-300);
            border-radius: 100px;
            cursor: pointer;
            transition: var(--transition);
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #ffffff;
            border-radius: 50%;
            transition: var(--transition);
        }

        .toggle input:checked + .toggle-slider {
            background: var(--accent-dark);
        }

        .toggle input:focus-visible + .toggle-slider {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        .modal-footer {
            padding: 0 1.5rem 1.5rem;
        }

        .btn-save {
            width: 100%;
            background: var(--accent-dark);
            color: #ffffff;
        }

        .btn-save:hover {
            background: var(--accent-darker);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-wipe {
            width: 100%;
            margin-top: 0.5rem;
            background: transparent;
            color: var(--slate-600);
            font-weight: 500;
        }

        .btn-wipe:hover {
            color: #b91c1c;
            background: #fef2f2;
        }

        .modal {
            max-height: calc(100dvh - 2rem);
            overflow-y: auto;
        }

        button, input, select, textarea { font-family: inherit; }

        :focus-visible {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        /* Notification Badge */
        .notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--slate-800);
            color: var(--wit);
            padding: 1rem 1.5rem;
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: max-content;
            max-width: calc(100vw - 2rem);
            text-align: center;
            opacity: 0;
            transition: var(--transition);
            z-index: 50;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            .header {
                padding: 2rem 1.5rem 3rem;
            }

            .back-link {
                position: static;
                display: flex;
                justify-content: center;
                width: fit-content;
                margin: -1.5rem auto 0.75rem;
            }

            .settings-btn {
                top: 1.5rem;
                right: 1rem;
            }
        }
    
        /* Onder Constructie: gedeelde footer en quote (huisstijl) */
        footer.oc-footer {
            text-align: center;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
            margin-top: 2rem;
            border-top: 1px solid var(--slate-200);
            background: var(--wit);
            color: var(--ink);
        }

        footer.oc-footer .oc-quote {
            font-size: 0.8125rem;
            line-height: 1.5;
            color: var(--ink);
            opacity: 1;
            font-style: normal;
            margin: 0;
        }
    
        /* Einde van een blok: blijft zichtbaar tot je verder gaat (ook zonder geluid) */
        .done-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 1.25rem auto 0;
            max-width: 22rem;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            background: var(--accent-light);
            border: 1.5px solid var(--accent);
            color: var(--ink-2);
            font-size: 0.9375rem;
            font-weight: 600;
            line-height: 1.4;
            text-align: left;
        }
        .done-msg[hidden] { display: none; }
        .done-msg svg { width: 20px; height: 20px; flex: none; }
        .timer-card.is-done { box-shadow: 0 0 0 6px var(--accent-ring); }

        /* Donkere modus: rustig donker slate, groen accent */
        

        /* Hoog contrast: het gekozen blok krijgt een dikke rand en een vinkje */
        @media (forced-colors: active) {
            .mode-tab, .btn { border: 1px solid ButtonText; }
            .mode-tab[aria-pressed="true"] { border: 3px solid Highlight; }
            .mode-tab[aria-pressed="true"]::before { content: "\2713  "; }
            .progress-dot { border: 1px solid CanvasText; }
            .progress-dot.completed, .progress-dot.current { forced-color-adjust: none; background: Highlight; border-color: Highlight; }
            .toggle-slider { border: 1px solid CanvasText; }
            .toggle input:checked + .toggle-slider { forced-color-adjust: none; background: Highlight; }
            .done-msg { border: 3px solid Highlight; }
            :focus-visible { outline: 3px solid Highlight; }
        }

        /* Minder beweging */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
            .btn-primary:hover { transform: none; }
        }

        /* Soepel op gsm: geen tikvertraging, eigen tikfeedback, grote knoppen in de duimzone */
        a, button, label, summary { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn:active, .mode-tab:active { filter: brightness(0.93); }
        @media (pointer: coarse) {
            .timer-controls .btn, .controls .btn { min-height: 56px; font-size: 1.0625rem; }
        }
    </style>
</head>

            </svg>
            Zakmes
        </a>
        <button class="settings-btn" id="openSettings" title="Instellingen" aria-label="Instellingen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>

            </svg>
        </button>
        <div class="logo">
            <svg aria-hidden="true" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><rect x="17.5" y="7" width="5" height="3" rx="1.2" fill="#94a3b8"/><line x1="20" y1="10" x2="20" y2="12" stroke="#94a3b8" stroke-width="2"/><circle cx="20" cy="22" r="9.5" stroke="#cbd5e1" stroke-width="3"/><path d="M20 12.5 A9.5 9.5 0 0 1 29.03 25" stroke="#10b981" stroke-width="3" stroke-linecap="round"/><path d="M20 22 L20 12.5 A9.5 9.5 0 0 1 29.03 25 Z" fill="#10b981" opacity=".18"/><circle cx="20" cy="22" r="1.8" fill="#047857"/></svg>
        </div>
        <h1 class="site-title">Focus</h1>
        <p class="site-subtitle">Geconcentreerd werken in blokken, met pauzes</p>
    </header>

    <!-- Main -->
    <main class="main">
        <!-- Mode Tabs -->
        <div class="mode-tabs" role="group" aria-label="Soort blok">
            <button class="mode-tab active" data-mode="focus" aria-pressed="true">Focus</button>
            <button class="mode-tab" data-mode="break" aria-pressed="false">Pauze</button>
            <button class="mode-tab" data-mode="long-break" aria-pressed="false">Lange pauze</button>
        </div>

        <!-- Timer Card -->
        <div class="timer-card" data-mode="focus" id="timerCard">
            <p class="timer-label" id="timerLabel">Focustijd</p>
            <p class="timer-display" id="timerDisplay" role="timer" aria-live="off">25:00</p>
            <div class="timer-controls">
                <button class="btn btn-primary" id="startBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    Opnieuw
                </button>
            </div>
            <p class="done-msg" id="doneMsg" role="alert" hidden></p>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-dots" id="progressDots">
                <div class="progress-dot current"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
            </div>
            <p class="progress-label">
                Sessie <span class="progress-count" id="sessionCount">1</span> van <span id="totalSessions">4</span>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer oc-footer">
        <p class="quote oc-quote">Het is niet dat we weinig tijd hebben, maar dat we er veel verspillen.</p>
    </footer>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
            <div class="modal-header">
                <h2 class="modal-title" id="settingsTitle">Instellingen</h2>
                <button class="modal-close" id="closeSettings" aria-label="Sluiten">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label class="setting-label" for="focusTime">
                        <span class="dot focus"></span>
                        Focustijd
                    </label>
                    <div class="setting-input-row">
                        <input type="number" class="setting-input" id="focusTime" value="25" min="1" max="120">
                        <span class="setting-unit">minuten</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="breakTime">
                        <span class="dot break"></span>
                        Korte pauze
                    </label>
                    <div class="setting-input-row">
                        <input type="number" class="setting-input" id="breakTime" value="5" min="1" max="30">
                        <span class="setting-unit">minuten</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="longBreakTime">
                        <span class="dot long-break"></span>
                        Lange pauze
                    </label>
                    <div class="setting-input-row">
                        <input type="number" class="setting-input" id="longBreakTime" value="15" min="1" max="60">
                        <span class="setting-unit">minuten</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="sessionsCount">Sessies voor lange pauze</label>
                    <div class="setting-input-row">
                        <input type="number" class="setting-input" id="sessionsCount" value="4" min="2" max="10">
                        <span class="setting-unit">sessies</span>
                    </div>
                </div>
                <div class="setting-divider"></div>
                <div class="setting-row">
                    <div>
                        <p class="setting-row-label" id="soundLabel">Geluidssignaal</p>
                        <p class="setting-row-desc">Speel een geluid aan het einde</p>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="soundEnabled" checked aria-labelledby="soundLabel">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-save" id="saveSettings">Opslaan</button>
                <button class="btn btn-wipe" id="wipeSettings">Instellingen terugzetten</button>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification" role="status" aria-live="polite"></div>

    <script>
        // State
        const DEFAULTS = {
            focusTime: 25,
            breakTime: 5,
            longBreakTime: 15,
            sessionsCount: 4,
            soundEnabled: true
        };
        let settings = { ...DEFAULTS };

        let state = {
            mode: 'focus',
            timeLeft: settings.focusTime * 60,
            isRunning: false,
            currentSession: 1,
            interval: null,
            endAt: 0
        };

        // Elements
        const timerCard = document.getElementById('timerCard');
        const timerLabel = document.getElementById('timerLabel');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const modeTabs = document.querySelectorAll('.mode-tab');
        const progressDots = document.getElementById('progressDots');
        const sessionCount = document.getElementById('sessionCount');
        const totalSessions = document.getElementById('totalSessions');
        const settingsModal = document.getElementById('settingsModal');
        const notification = document.getElementById('notification');
        const doneMsg = document.getElementById('doneMsg');

        // ---- Lopende timer bewaren: het eindtijdstip staat in de opslag, zodat de timer na herladen verder telt ----
        const MODES = ['focus', 'break', 'long-break'];
        function persistRun() {
            try {
                localStorage.setItem('focusRun', JSON.stringify({
                    v: 1, mode: state.mode, session: state.currentSession,
                    running: state.isRunning, endAt: state.isRunning ? state.endAt : 0, left: state.timeLeft
                }));
            } catch (e) {}
        }
        function readRun() {
            try {
                const r = JSON.parse(localStorage.getItem('focusRun') || 'null');
                if (!r || typeof r !== 'object' || !MODES.includes(r.mode)) return null;
                return r;
            } catch (e) { return null; }
        }

        // ---- Scherm wakker houden tijdens een blok ----
        let wakeLock = null;
        async function lockWake() {
            if (!state.isRunning || wakeLock || document.visibilityState !== 'visible') return;
            try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
        }
        function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

        // ---- De app laten weten dat er een timer loopt (titel: F = focus, P = pauze) ----
        let lastBusyMin = null;
        function fmt(s) { return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
        function postBusy(busy, extra) {
            try {
                if (window.parent === window) return;
                const title = busy ? `${state.mode === 'focus' ? 'F' : 'P'} ${fmt(state.timeLeft)}` : '';
                window.parent.postMessage(Object.assign({ type: 'oc-busy', busy: !!busy, title }, extra || {}), '*');
            } catch (e) {}
        }
        function busyTick() {
            const m = Math.ceil(state.timeLeft / 60);
            if (m !== lastBusyMin) { lastBusyMin = m; postBusy(true); }
        }

        // Load settings from localStorage
        // Kapotte of geblokkeerde opslag mag de timer nooit tegenhouden: dan gewoon de standaardwaarden.
        const clampInt = (v, min, max, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : d; };
        function cleanSettings(o) {
            o = (o && typeof o === 'object') ? o : {};
            return {
                focusTime: clampInt(o.focusTime, 1, 120, DEFAULTS.focusTime),
                breakTime: clampInt(o.breakTime, 1, 30, DEFAULTS.breakTime),
                longBreakTime: clampInt(o.longBreakTime, 1, 60, DEFAULTS.longBreakTime),
                sessionsCount: clampInt(o.sessionsCount, 2, 10, DEFAULTS.sessionsCount),
                soundEnabled: typeof o.soundEnabled === 'boolean' ? o.soundEnabled : DEFAULTS.soundEnabled
            };
        }
        function loadSettings() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('focusSettings') || 'null'); } catch (e) { saved = null; }
            settings = cleanSettings(saved);
            updateSettingsUI();
        }

        // Save settings to localStorage
        function saveSettings() {
            try { localStorage.setItem('focusSettings', JSON.stringify(settings)); } catch (e) {}
        }

        // Update settings UI
        function updateSettingsUI() {
            document.getElementById('focusTime').value = settings.focusTime;
            document.getElementById('breakTime').value = settings.breakTime;
            document.getElementById('longBreakTime').value = settings.longBreakTime;
            document.getElementById('sessionsCount').value = settings.sessionsCount;
            document.getElementById('soundEnabled').checked = settings.soundEnabled;
            totalSessions.textContent = settings.sessionsCount;
            updateProgressDots();
        }

        // Update progress dots
        function updateProgressDots() {
            progressDots.innerHTML = '';
            for (let i = 1; i <= settings.sessionsCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i < state.currentSession) dot.classList.add('completed');
                if (i === state.currentSession) dot.classList.add('current');
                progressDots.appendChild(dot);
            }
        }

        // Update timer display
        function updateTimer() {
            const minutes = Math.floor(state.timeLeft / 60);
            const seconds = state.timeLeft % 60;
            const txt = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timerDisplay.textContent === txt && state.isRunning) return;   // niets veranderd: niets hertekenen
            timerDisplay.textContent = txt;
            document.title = state.isRunning || state.timeLeft !== fullTime(state.mode) ? `${timerDisplay.textContent} - Focus` : 'Focus – Onder Constructie';
        }

        function fullTime(mode) {
            return (mode === 'break' ? settings.breakTime : mode === 'long-break' ? settings.longBreakTime : settings.focusTime) * 60;
        }

        function hideDone() {
            doneMsg.hidden = true;
            timerCard.classList.remove('is-done');
        }
        function showDone(text) {
            doneMsg.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg><span></span>';
            doneMsg.querySelector('span').textContent = text;
            doneMsg.hidden = false;
            timerCard.classList.add('is-done');
        }

        // Set mode
        function setMode(mode) {
            state.mode = mode;
            
            switch (mode) {
                case 'focus':
                    state.timeLeft = settings.focusTime * 60;
                    timerLabel.textContent = 'Focustijd';
                    break;
                case 'break':
                    state.timeLeft = settings.breakTime * 60;
                    timerLabel.textContent = 'Korte pauze';
                    break;
                case 'long-break':
                    state.timeLeft = settings.longBreakTime * 60;
                    timerLabel.textContent = 'Lange pauze';
                    break;
            }

            timerCard.dataset.mode = mode;
            modeTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
                tab.setAttribute('aria-pressed', tab.dataset.mode === mode);
            });
            updateTimer();
            updateStartButton();
        }

        // Update start button
        function updateStartButton() {
            if (state.isRunning) {
                startBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    Even stoppen
                `;
            } else {
                startBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                `;
            }
        }

        // Request notification permission
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }

        // Send browser notification
        function sendBrowserNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const notification = new Notification(title, {
                    body: body,
                    tag: 'focus-timer',
                    requireInteraction: true
                });

                notification.onclick = () => {
                    window.focus();
                    notification.close();
                };

                setTimeout(() => notification.close(), 10000);
            }
        }

        // Start/Pause timer
        function runTimer() {
            state.isRunning = true;
            clearInterval(state.interval);
            state.interval = setInterval(tick, 500);
            lastBusyMin = null;
            busyTick();
            lockWake();
        }
        function toggleTimer() {
            requestNotificationPermission();
            
            if (state.isRunning) {
                clearInterval(state.interval);
                state.timeLeft = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
                state.isRunning = false;
                releaseWake();
                postBusy(false);
                updateTimer();
            } else {
                hideDone();
                if (state.timeLeft <= 0) state.timeLeft = fullTime(state.mode);
                state.endAt = Date.now() + state.timeLeft * 1000;
                runTimer();
            }
            persistRun();
            updateStartButton();
        }

        // Timer tick: telt af tot het bewaarde eindtijdstip (klopt ook als de pagina even in de achtergrond zat)
        function tick() {
            if (!state.isRunning) return;
            state.timeLeft = Math.max(0, Math.ceil((state.endAt - Date.now()) / 1000));
            updateTimer();
            if (state.timeLeft > 0) {
                busyTick();
            } else {
                clearInterval(state.interval);
                state.isRunning = false;
                onTimerComplete();
            }
        }

        // Timer complete (late: het blok liep af terwijl de pagina dicht was)
        function onTimerComplete(late) {
            if (settings.soundEnabled && !late) {
                playSound();
            }
            // Ook zonder geluid: trillen waar het toestel dat kan
            try { if ('vibrate' in navigator) navigator.vibrate([200, 100, 200, 100, 300]); } catch (e) {}
            releaseWake();
            const wasFocus = state.mode === 'focus';
            const when = late ? ` (om ${new Date(state.endAt).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })})` : '';
            let msg;

            if (state.mode === 'focus') {
                if (state.currentSession >= settings.sessionsCount) {
                    msg = `Focusblok klaar${when}. Alle sessies gedaan: tijd voor een lange pauze.`;
                    sendBrowserNotification('Alle sessies voltooid', 'Alle sessies afgerond. Tijd voor een lange pauze.');
                    state.currentSession = 1;
                    setMode('long-break');
                } else {
                    msg = `Focusblok klaar${when}. Neem een korte pauze.`;
                    sendBrowserNotification('Focustijd voorbij', 'Goed gedaan. Neem nu een korte pauze.');
                    setMode('break');
                }
            } else {
                if (state.mode === 'break') {
                    state.currentSession++;
                }
                msg = `Pauze voorbij${when}. Klaar voor het volgende blok?`;
                sendBrowserNotification('Pauze voorbij', 'Klaar voor de volgende focussessie?');
                setMode('focus');
            }

            showDone(msg);
            document.title = (wasFocus ? 'Blok klaar' : 'Pauze voorbij') + ' - Focus';
            postBusy(false, { done: true, message: msg });
            persistRun();
            sessionCount.textContent = state.currentSession;
            updateProgressDots();
            updateStartButton();
        }

        // Play notification sound
        function playSound() {
            try { playTones(); } catch (e) {}
        }
        function playTones() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                osc2.connect(gain2);
                gain2.connect(audioContext.destination);
                osc2.frequency.value = 1000;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.5);
            }, 200);
        }

        // Show notification
        function showNotification(message) {
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        // Opnieuw: het huidige blok terug naar het begin
        function resetTimer() {
            const was = state.isRunning;
            clearInterval(state.interval);
            state.isRunning = false;
            releaseWake();
            if (was) postBusy(false);
            hideDone();
            setMode(state.mode);
            persistRun();
            updateStartButton();
        }

        // Event Listeners
        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        modeTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                if (!state.isRunning) {
                    hideDone();
                    setMode(tab.dataset.mode);
                    persistRun();
                }
            });
        });

        document.getElementById('openSettings').addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        document.getElementById('closeSettings').addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        document.getElementById('saveSettings').addEventListener('click', () => {
            settings = cleanSettings({
                focusTime: document.getElementById('focusTime').value,
                breakTime: document.getElementById('breakTime').value,
                longBreakTime: document.getElementById('longBreakTime').value,
                sessionsCount: document.getElementById('sessionsCount').value,
                soundEnabled: document.getElementById('soundEnabled').checked
            });
            if (state.currentSession > settings.sessionsCount) state.currentSession = 1;
            sessionCount.textContent = state.currentSession;

            saveSettings();
            updateSettingsUI();
            
            if (!state.isRunning) {
                setMode(state.mode);
            }
            persistRun();

            settingsModal.classList.remove('active');
            showNotification('Instellingen opgeslagen');
        });

        // Alles wissen: de eigen sleutel weg en terug naar de standaardwaarden
        document.getElementById('wipeSettings').addEventListener('click', () => {
            try { localStorage.removeItem('focusSettings'); localStorage.removeItem('focusRun'); } catch (e) {}
            const was = state.isRunning;
            clearInterval(state.interval);
            state.isRunning = false;
            releaseWake();
            if (was) postBusy(false);
            hideDone();
            settings = { ...DEFAULTS };
            state.currentSession = 1;
            sessionCount.textContent = 1;
            updateSettingsUI();
            setMode('focus');
            settingsModal.classList.remove('active');
            showNotification('Instellingen teruggezet');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && settingsModal.classList.contains('active')) {
                settingsModal.classList.remove('active');
                return;
            }
            if (e.target.tagName === 'INPUT' || settingsModal.classList.contains('active')) return;
            if (e.code === 'Space' && e.target.closest && e.target.closest('button, a')) return;
            
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyR') {
                resetTimer();
            }
        });

        // Terug naar de pagina: meteen bijwerken en het scherm opnieuw wakker houden
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') { tick(); lockWake(); }
        });
        addEventListener('pagehide', () => { if (state.isRunning) postBusy(false); });

        // Initialize
        loadSettings();
        setMode('focus');
        (function restoreRun() {
            const r = readRun();
            if (!r) return;
            state.currentSession = clampInt(r.session, 1, settings.sessionsCount, 1);
            sessionCount.textContent = state.currentSession;
            setMode(r.mode);
            if (r.running && Number.isFinite(r.endAt) && r.endAt > 0) {
                state.endAt = r.endAt;
                const left = Math.ceil((r.endAt - Date.now()) / 1000);
                if (left > 0) {
                    state.timeLeft = Math.min(left, 24 * 3600);
                    updateTimer();
                    runTimer();
                } else {
                    state.timeLeft = 0;
                    onTimerComplete(true);
                }
            } else if (Number.isFinite(r.left)) {
                state.timeLeft = clampInt(r.left, 0, fullTime(r.mode), fullTime(r.mode)) || fullTime(r.mode);
                updateTimer();
            }
            updateProgressDots();
            updateStartButton();
        })();
    </script>
<script>
/* oc-sync: reageert op "Afsluiten" in de app (ook in andere tabbladen) en geeft Esc door aan de app */
(function () {
  if (window.__ocSync) return; window.__ocSync = true;
  var gewist = false;
  function wis() {
    if (gewist) return; gewist = true;
    try { var orig = Storage.prototype.setItem; Storage.prototype.setItem = function (k, v) { if (k === 'oc.wis') return orig.call(this, k, v); }; } catch (e) {}
    try { document.body.innerHTML = '<p role="status" style="font-family:\'DM Sans\',system-ui,sans-serif;padding:3rem 1.5rem;text-align:center;color:#475569;font-size:1.0625rem">Er is iets gewist op dit toestel. Deze pagina laadt opnieuw…</p>'; } catch (e) {}
    setTimeout(function () { location.reload(); }, 400);
  }
  try { var bc = new BroadcastChannel('oc-sync'); bc.onmessage = function (e) { if (e.data && e.data.type === 'wis') wis(); }; } catch (e) {}
  addEventListener('storage', function (e) { if (e.key === 'oc.wis' || e.key === null) wis(); });
  if (window.parent === window) return;
  addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    var a = document.activeElement;
    if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
    if (document.querySelector('dialog[open], [role="dialog"]:not([hidden]):not([aria-hidden="true"]), [aria-modal="true"]:not([hidden]), [aria-expanded="true"], .open, .show, .active.modal, .is-open')) return;
    try { parent.postMessage({ type: 'oc-esc' }, location.origin); } catch (err) {}
  }, true);
})();
</script>
</body>
